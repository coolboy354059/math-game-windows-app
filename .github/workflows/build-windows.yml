name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows app
        run: dotnet publish MathGameWindowsApp.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: math-game-windows-app
          path: publish
